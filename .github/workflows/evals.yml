name: Evals

# Corre la suite `evals/` del plugin contra Claude: mide si la skill se dispara
# y si las respuestas son correctas, con y sin plugin. Es MANUAL a proposito:
# cada corrida gasta API, y el veredicto no cambia si no cambia la skill.
#
# Por que en Linux: el Bash del agente corre en un sandbox del sistema, y Windows
# no tiene uno nativo. Aqui el sandbox es bubblewrap.
#
# Requiere el secreto ANTHROPIC_API_KEY en el repo.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Corridas por caso y brazo"
        default: "3"
      threshold:
        description: "Puntaje minimo por caso (0..1)"
        default: "0.8"
      max_cost_usd:
        description: "Tope de gasto de la corrida (USD)"
        default: "10"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals:
    name: evals del plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Hay credencial
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Falta el secreto ANTHROPIC_API_KEY (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sandbox (bubblewrap)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat
          # Ubuntu 24.04 restringe los user namespaces sin privilegio que usa bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Instalar Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Correr la suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . \
            --trust-plugin --scaffold \
            --allow-tools Bash "WebFetch(domain:github.com)" "WebFetch(domain:pypi.org)" "WebFetch(domain:files.pythonhosted.org)" \
            --runs "${{ inputs.runs }}" \
            --threshold "${{ inputs.threshold }}" \
            --max-cost-usd "${{ inputs.max_cost_usd }}" \
            --no-publish \
            --json evals-result.json \
            --report evals-report.html

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals
          path: |
            evals-result.json
            evals-report.html
          retention-days: 7
          if-no-files-found: ignore
